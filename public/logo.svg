<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" fill="none">
  <!-- Orbital Swoosh -->
  <path
    d="M46 138 C165 178, 390 170, 566 112"
    stroke="#FFFFFF"
    stroke-width="8.5"
    stroke-linecap="round"
  />
  <!-- 4-Point Sparkle Star -->
  <path
    d="M526 30 L533 50 L554 57 L533 64 L526 84 L519 64 L498 57 L519 50 Z"
    fill="#FFFFFF"
  />
  <!-- Stylized Italic Wordmark "ultimate" rendered as crisp geometric stroke/fill vector -->
