    <text
      x="0"
      y="0"
      fill="#FFFFFF"
      font-family="Arial Black, Impact, system-ui, sans-serif"
      font-size="94"
      font-weight="900"
      letter-spacing="-3"
    >
      ultimate
    </text>
  </g>
</svg>
